worker_processes 1;
error_log /var/log/enterprise-sso-nginx/error.log warn;
pid /run/enterprise-sso-nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /var/log/enterprise-sso-nginx/access.log;

    server {
    listen 8443 ssl;
    server_name 210.47.163.114;

    ssl_certificate /etc/enterprise-sso/tls/server-bundle.crt;
    ssl_certificate_key /etc/enterprise-sso/tls/server.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ENTERPRISE_SSO_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64k;

    # Campus public network and RFC1918 internal/VPN networks only.
    allow 127.0.0.1;
    allow 210.47.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    # Deliberately no HSTS: the same IP still hosts unrelated HTTP systems.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    }
}
